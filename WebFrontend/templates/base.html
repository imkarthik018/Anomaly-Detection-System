<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Anomaly Detection{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="app-body">
  <nav class="navbar navbar-expand border-bottom border-secondary mb-3 py-2" style="--bs-border-opacity: .25;">
    <div class="container">
      <span class="navbar-brand fw-semibold text-white-50 small">SOC Console</span>
      <div class="navbar-nav ms-auto gap-2 flex-row">
        <a class="nav-link px-2 py-1 rounded small" href="{{ url_for('index') }}">Batch analysis</a>
        <a class="nav-link px-2 py-1 rounded small" href="{{ url_for('login_page') }}">Login (live)</a>
        <a class="nav-link px-2 py-1 rounded small" href="{{ url_for('live_monitor') }}">Live threat monitor</a>
      </div>
    </div>
  </nav>
  <div class="container py-2 pb-4">
    <h1 class="app-title text-center mb-4">{% block page_heading %}Anomaly Detection{% endblock %}</h1>
    {% block content %}{% endblock %}
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
